[package]
name = "actenon-fresh-consumer"
version = "0.0.0"
edition = "2021"
publish = false

# Exactly the dependency line the actenon-verifier-sdk README documents.
[dependencies]
actenon-verifier-sdk = "0.2"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
