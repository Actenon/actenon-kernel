name: Invariants

# WO-9 invariants: independence, neutrality, cloud-optional.
# These are the claims a security reviewer tests first. They must be
# executable, not prose.

on:
  push:
    branches: [main, master]
  pull_request:

# bash with -o pipefail: `pytest ... | tee` fails the step when pytest fails.
# (The default `bash -e` does not, which let failing conformance runs pass.)
defaults:
  run:
    shell: bash

# Temporary immutable input while Protocol 1.6.0 awaits registry publication.
env:
  PIP_CONSTRAINT: ${{ github.workspace }}/.github/candidate-constraints.txt

jobs:
  invariant-tests:
    name: Invariant tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install "actenon-protocol>=1.6.0,<2"
          pip install -e ".[asymmetric,mcp,dev]"

      - name: Run independence test (no cloud/permit/scan imports)
        run: python -m pytest tests/test_independence.py -v

      - name: Run neutrality test (verification makes no network calls)
        run: python -m pytest tests/test_neutrality.py -v

      - name: Run cloud-optional test (no hidden cloud dependency)
        run: python -m pytest tests/test_cloud_optional.py -v

      - name: Assert dependency direction
        run: python scripts/assert_dep_direction.py

  clean-install:
    name: Clean-install closure check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist/

      - name: Install ONLY the wheel in a fresh venv
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --upgrade pip
          /tmp/clean/bin/pip install dist/actenon_kernel-*.whl

      - name: Import the top-level module
        run: |
          /tmp/clean/bin/python -c "import actenon; print('actenon imported OK')"

      - name: Assert pip list matches declared closure
        run: |
          echo "=== pip list | grep ^actenon ==="
          /tmp/clean/bin/pip list | grep ^actenon || true
          echo "=== Expected: actenon-kernel + actenon-protocol (transitive) ==="
          # The kernel declares actenon-protocol as a runtime dep.
          # A clean install should have exactly: actenon-kernel, actenon-protocol.
          COUNT=$(/tmp/clean/bin/pip list | grep -c '^actenon')
          if [ "$COUNT" -ne 2 ]; then
            echo "FAIL: expected exactly 2 actenon packages (kernel + protocol), found $COUNT"
            /tmp/clean/bin/pip list | grep ^actenon
            exit 1
          fi
          echo "OK: clean install has exactly 2 actenon packages"

      - name: Packaged data files load from the installed wheel
        # `actenon-kernel scan` reads a JSON registry shipped as package data.
        # It was missing from every wheel up to 1.2.1, and scan failed with
        # FileNotFoundError from an install while passing from a checkout.
        # scan exits 1 when it finds execution gaps (expected here), so the
        # check is on the output, not the status.
        run: |
          mkdir -p "$RUNNER_TEMP/scan-target"
          printf 'def refund(amount):\n    return stripe.Refund.create(amount=amount)\n' > "$RUNNER_TEMP/scan-target/app.py"
          cd "$RUNNER_TEMP"
          set +e
          /tmp/clean/bin/actenon-kernel scan repo --path "$RUNNER_TEMP/scan-target" > scan.txt 2>&1
          set -e
          cat scan.txt
          grep -q '^Overall status: EXECUTION_GAP_PRESENT' scan.txt
          ! grep -q '^ERROR:' scan.txt

      - name: Run conformance suite against the installed wheel
        # The base install has NO extras. This proves the README claim:
        # "pip install actenon-kernel # full verifier: HMAC and Ed25519"
        # Run from outside the checkout with --import-mode=importlib so
        # `import actenon` resolves to the wheel, not ./actenon (running from
        # the repository root tested the source tree).
        run: |
          /tmp/clean/bin/pip install pytest
          cd "$RUNNER_TEMP"
          /tmp/clean/bin/python -c 'import actenon, sys; print(actenon.__file__); sys.exit("site-packages" not in actenon.__file__)'
          /tmp/clean/bin/python -m pytest -p no:cacheprovider --import-mode=importlib --rootdir "$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE/tests/conformance" --pyargs actenon.conformance -q -rs

  base-install-conformance:
    name: Base-install conformance (no extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install kernel with NO extras
        run: |
          python -m venv /tmp/base
          /tmp/base/bin/pip install --upgrade pip
          /tmp/base/bin/pip install pytest
          /tmp/base/bin/pip install -e .

      - name: Verify cryptography IS installed
        # Since 1.1.0 cryptography is a base dependency: the reference
        # broker mints Ed25519, so the default install must verify it.
        # See FINDINGS.md "RESOLVED: base-install conformance".
        run: |
          /tmp/base/bin/python -c "import cryptography; print('OK: base install has cryptography', cryptography.__version__)"

      - name: Run conformance suite
        run: |
          /tmp/base/bin/python -m pytest tests/conformance/ -v --tb=short 2>&1 | tee /tmp/conformance-output.txt
          echo "=== Summary ==="
          tail -5 /tmp/conformance-output.txt

      - name: Assert zero skips
        # Every conformance test must EXECUTE on a base install. A skip
        # means the default install cannot verify something the ecosystem
        # produces — the defect this gate exists to prevent.
        run: |
          SKIPPED=$(grep -c 'SKIPPED' /tmp/conformance-output.txt || true)
          PASSED=$(grep -c 'PASSED' /tmp/conformance-output.txt || true)
          echo "Base-install conformance: $PASSED passed, $SKIPPED skipped"
          if [ "$SKIPPED" -ne 0 ]; then
            echo "FAIL: $SKIPPED conformance tests skipped on a base install"
            grep 'SKIPPED' /tmp/conformance-output.txt
            exit 1
          fi
