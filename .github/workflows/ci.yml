name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# bash with -o pipefail: a failing command piped into tee/tail fails the step.
defaults:
  run:
    shell: bash

jobs:
  test:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the protocol package first so the kernel's pyproject
          # constraint `actenon-protocol>=1.1.0,<2` resolves cleanly.
          python -m pip install "actenon-protocol>=1.1.0,<2"
          # Every optional integration the suite exercises is installed, so
          # its tests execute instead of skipping (see the skip gate below).
          python -m pip install -e ".[asymmetric,mcp,dev,langchain,fastapi]"
          python -m pip install httpx

      - name: Compile package and examples
        run: |
          python -m compileall actenon examples

      - name: Run demo
        run: make demo

      - name: Run full test suite
        # The configured testpaths (actenon/ and tests/) on every supported
        # Python version. `pytest tests/` alone missed actenon/conformance,
        # the shared verifier-vector runner (edge binding, revocation).
        run: python -m pytest -q -rs --junitxml=junit-suite.xml

      - name: Run example tests
        # The examples are documentation that executes; they must pass.
        run: python -m pytest examples -q -rs --junitxml=junit-examples.xml

      - name: No unexpected skips
        # A skipped test is work CI claims but did not do.
        run: python scripts/assert_no_unexpected_skips.py junit-suite.xml junit-examples.xml

      - name: Run conformance suite
        # The conformance suite MUST run on every push and PR, not just on
        # conformance-v* tags. This is the public compatibility gate.
        run: python -m pytest tests/conformance/ -q

      # Claim-verification steps moved to verify-claims.yml (one copy of
      # each check; the README badge links there).

  typescript-verifier:
    name: TypeScript verifier SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: sdk/typescript

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Typecheck
        # The package's typecheck script is `check`; `typecheck --if-present`
        # matched no script and silently ran nothing.
        run: npm run check

      - name: Test
        # The test files use node:test (not bun:test), so we must use
        # `npm test` (which runs `node --import tsx --test`) rather than
        # `bun test` (which doesn't support nested node:test calls).
        run: npm test

      - name: Packed tarball imports in plain Node
        # What npm consumers get: the packed tarball, installed into an empty
        # project, imported as ESM with no TypeScript tooling.
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          npm init -y >/dev/null
          npm install "$RUNNER_TEMP"/actenon-verifier-sdk-*.tgz
          node --input-type=module -e '
            import { VerifierSDK, Ed25519Verifier, buildLocalProofVerifier } from "@actenon/verifier-sdk";
            const sdk = new VerifierSDK(buildLocalProofVerifier());
            if (typeof sdk.verifyJSON !== "function" || typeof sdk.verify !== "undefined") process.exit(1);
            if (typeof Ed25519Verifier !== "function") process.exit(1);
            console.log("packed @actenon/verifier-sdk imports OK");
          '

  go-verifier:
    # The Go verifier SDK lives in github.com/Actenon/sdk-go. This job runs it
    # at the commit pinned in sdk/standalone-sdk-pins.json against THIS
    # kernel's vectors, so a vector change here fails until the SDK follows.
    name: Go verifier SDK (standalone, pinned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the sdk-go pin
        id: pin
        run: |
          python3 -c "import json; p=json.load(open('sdk/standalone-sdk-pins.json'))['sdk-go']; print('repository=' + p['repository']); print('sha=' + p['sha'])" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.pin.outputs.repository }}
          ref: ${{ steps.pin.outputs.sha }}
          path: _sdk/sdk-go

      - name: Check the checkout is the pinned commit
        run: test "$(git -C _sdk/sdk-go rev-parse HEAD)" = "${{ steps.pin.outputs.sha }}"

      - name: Vendored kernel vectors match this kernel
        run: python3 scripts/check_standalone_sdk_fixtures.py _sdk/sdk-go

      - uses: actions/setup-go@v5
        with:
          go-version-file: _sdk/sdk-go/go.mod
          cache: false

      - name: Test sdk-go and its vendored vectors against this kernel
        working-directory: _sdk/sdk-go
        env:
          ACTENON_KERNEL_VECTOR_LOCK: ${{ github.workspace }}/conformance/vector-lock.json
        run: |
          go vet ./...
          go test -race -count=1 ./...

  rust-verifier:
    # The Rust verifier SDK lives in github.com/Actenon/sdk-rust; see go-verifier.
    # Lints (fmt, clippy) are the SDK repository's own gate, so a new stable
    # clippy lint cannot turn this job red without a behaviour change.
    name: Rust verifier SDK (standalone, pinned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the sdk-rust pin
        id: pin
        run: |
          python3 -c "import json; p=json.load(open('sdk/standalone-sdk-pins.json'))['sdk-rust']; print('repository=' + p['repository']); print('sha=' + p['sha'])" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.pin.outputs.repository }}
          ref: ${{ steps.pin.outputs.sha }}
          path: _sdk/sdk-rust

      - name: Check the checkout is the pinned commit
        run: test "$(git -C _sdk/sdk-rust rev-parse HEAD)" = "${{ steps.pin.outputs.sha }}"

      - name: Vendored kernel vectors match this kernel
        run: python3 scripts/check_standalone_sdk_fixtures.py _sdk/sdk-rust

      - uses: dtolnay/rust-toolchain@stable

      - name: Test sdk-rust and its vendored vectors against this kernel
        working-directory: _sdk/sdk-rust
        env:
          ACTENON_KERNEL_VECTOR_LOCK: ${{ github.workspace }}/conformance/vector-lock.json
        run: |
          cargo test --all-targets --locked
          cargo test --doc --locked

  # The verify-claims job moved to verify-claims.yml so the README
  # badge can link to a dedicated gate.
