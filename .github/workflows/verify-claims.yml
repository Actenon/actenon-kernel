name: Verify claims

# Machine-enforce every claim the README makes about the kernel.
# For a trust product, one falsified claim costs more than ten missing
# features. These checks previously lived as a job inside ci.yml plus
# duplicate steps in the test job; they have their own workflow so the
# README badge can link to the gate, and exactly one copy of each check
# exists.
#
# The daily schedule matters: the registry-install check depends on live
# PyPI state, which can change with no PR to catch it.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "47 6 * * *"
  workflow_dispatch:

# Temporary immutable input while Protocol 1.5.0 awaits registry publication.
env:
  PIP_CONSTRAINT: ${{ github.workspace }}/.github/candidate-constraints.txt

jobs:
  verify-claims:
    name: Verify README claims (machine-enforced)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "actenon-protocol>=1.5.0,<2"
          python -m pip install -e ".[mcp,dev]"

      - name: Verify zero network calls during verification (neutrality)
        # The README claims "Zero network calls during verification" and
        # the offline-verification badge points at this test file. Run it
        # here so the claim is gated, not just linked.
        run: python -m pytest tests/test_neutrality.py -q

      - name: Verify kernel independence (runs without Permit, Cloud, or Scan)
        run: python -m pytest tests/test_independence.py -q

      - name: Verify dependency direction (kernel depends only on the protocol)
        run: python scripts/assert_dep_direction.py

      - name: Verify conformance manifest (hash-locked vectors)
        run: python scripts/verify_conformance_manifest.py

      - name: Verify conformance count matches the README
        # The badge and prose claim a specific number of conformance
        # vectors. Ask the conformance runner itself rather than trusting
        # the prose: `actenon.cli conformance run` reports "Ran N test(s)".
        run: |
          python - <<'EOF'
          import pathlib, re, subprocess, sys
          result = subprocess.run(
              [sys.executable, '-m', 'actenon.cli', 'conformance', 'run'],
              capture_output=True, text=True,
          )
          if result.returncode != 0:
              print('FAIL: conformance run failed', file=sys.stderr)
              print(result.stdout + result.stderr, file=sys.stderr)
              sys.exit(1)
          m = re.search(r'Ran (\d+) test\(s\)', result.stdout)
          if not m:
              print('FAIL: could not parse conformance test count', file=sys.stderr)
              sys.exit(1)
          actual = int(m.group(1))
          readme = pathlib.Path('README.md').read_text()
          badge = re.search(r'Conformance-[\d.]+--(\d+)%20vectors', readme)
          prose = re.search(r'(\d+) conformance vectors define', readme)
          failures = []
          if badge and int(badge.group(1)) != actual:
              failures.append(f'badge claims {badge.group(1)}, runner ran {actual}')
          if prose and int(prose.group(1)) != actual:
              failures.append(f'prose claims {prose.group(1)}, runner ran {actual}')
          if not badge or not prose:
              failures.append('conformance-count claim not found in README')
          # Every other count claim in the README must agree too (they drifted
          # to 51 while the runner executed 53 because only two were checked).
          for claimed in re.findall(r'(\d+) (?:conformance vectors\b|tests pass\b)', readme):
              if int(claimed) != actual:
                  failures.append(f'README claims {claimed} conformance vectors/tests, runner ran {actual}')
          if failures:
              for f in failures:
                  print(f'FAIL: {f}', file=sys.stderr)
              sys.exit(1)
          print(f'OK: README conformance count matches the runner ({actual} vectors)')
          EOF

      - name: Verify the MCP Registry ownership marker and server.json agree
        # The registry proves we own the PyPI package by finding an
        # `mcp-name:` marker in the README (which becomes the PyPI
        # description). Lose the marker or drift the version and the
        # listing silently stops updating, so both are machine-checked.
        run: |
          python - <<'EOF'
          import json, os, pathlib, sys, tomllib

          from packaging.version import Version

          server = json.loads(pathlib.Path("server.json").read_text())
          readme = pathlib.Path("README.md").read_text()
          package_version = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text()
          )["project"]["version"]

          problems = []
          marker = f"mcp-name: {server['name']}"
          if marker not in readme:
              problems.append(f"README.md is missing the ownership marker {marker!r}")

          # The registry namespace is CASE-SENSITIVE and must match the GitHub
          # owner exactly: it grants io.github.<Owner>/*. Getting this wrong
          # costs a published version, because the marker lives in the README
          # that PyPI freezes into the package description. Caught here instead.
          owner = os.environ.get("GITHUB_REPOSITORY", "/").split("/")[0]
          if owner:
              expected_prefix = f"io.github.{owner}/"
              if not server["name"].startswith(expected_prefix):
                  problems.append(
                      f"server.json name {server['name']!r} does not start with "
                      f"{expected_prefix!r} (namespace is case-sensitive; the "
                      f"registry grants io.github.<Owner>/* verbatim)"
                  )
          # Registry metadata is immutable per server version, so revising a
          # description or title requires a NEW server version. That revision
          # ships no new code, so server["version"] is allowed to run ahead of
          # the package version — they are deliberately separate fields.
          #
          # What must never happen is the listing pointing at a package that
          # does not exist. So: the declared package version may never be
          # AHEAD of what this repo has released, and the server version may
          # never be behind the package it ships.
          server_v = Version(server["version"])
          package_v = Version(package_version)
          if server_v < package_v:
              problems.append(
                  f"server.json version {server['version']} is behind the package "
                  f"version {package_version} — bump the server version forward"
              )
          for package in server["packages"]:
              declared = Version(package["version"])
              if declared > package_v:
                  problems.append(
                      f"server.json packages[].version {package['version']} is AHEAD "
                      f"of pyproject {package_version}: the listing would point at a "
                      f"package that has not been released"
                  )
              if package["identifier"] != "actenon-kernel":
                  problems.append(
                      f"unexpected package identifier {package['identifier']!r}"
                  )
          if problems:
              for problem in problems:
                  print(f"FAIL: {problem}", file=sys.stderr)
              sys.exit(1)
          print(
              f"OK: MCP Registry metadata coherent "
              f"(server {server['version']}, package {server['packages'][0]['version']}, "
              f"pyproject {package_version})"
          )
          EOF

      - name: Check generated Python badge
        run: python scripts/sync_badges.py --check

      - name: Check README registry installs
        run: python scripts/check_readme_installs.py

      - name: Check README ecosystem table
        run: python -m actenon_protocol.ecosystem --check README.md --repo actenon-kernel

      - name: Verify SUPPORT_AND_COMPATIBILITY_STATUS.md reflects actual CI matrix
        # Fable 5 Part 3A: the support doc previously claimed a Python 3.9–3.12
        # matrix while the actual CI ran 3.10–3.12 only. This gate enforces
        # that the doc and the workflow stay aligned.
        run: |
          python - <<'EOF'
          import re, sys, pathlib
          doc = pathlib.Path('docs/SUPPORT_AND_COMPATIBILITY_STATUS.md').read_text()
          m = re.search(r'a Python matrix over (.+)', doc)
          if not m:
              print('FAIL: could not find Python matrix claim in SUPPORT_AND_COMPATIBILITY_STATUS.md', file=sys.stderr)
              sys.exit(1)
          raw = m.group(1).replace('and', ',')
          claimed = sorted({v.strip() for v in raw.split(',') if v.strip()})
          actual = ['3.10', '3.11', '3.12']
          if claimed != actual:
              print(f'FAIL: doc claims Python matrix {claimed} but CI runs {actual}', file=sys.stderr)
              sys.exit(1)
          print(f'OK: doc and CI agree on Python matrix {actual}')
          EOF

      - name: Verify no Cloud or Permit imports in kernel
        # The kernel must never depend on Cloud or Permit. Cloud may depend
        # on the kernel. This is invariant #1 from the north star.
        run: |
          python - <<'EOF'
          import pathlib, sys
          forbidden = ['actenon_cloud', 'actenon_permit']
          violations = []
          for p in pathlib.Path('actenon').rglob('*.py'):
              text = p.read_text()
              for pkg in forbidden:
                  if f'import {pkg}' in text or f'from {pkg}' in text:
                      violations.append(f'{p}: imports {pkg}')
          if violations:
              print('FAIL: kernel imports Cloud or Permit (invariant #1 violation):', file=sys.stderr)
              for v in violations:
                  print(f'  {v}', file=sys.stderr)
              sys.exit(1)
          print('OK: kernel does not import Cloud or Permit')
          EOF

      - name: Verify protocol version pin
        run: |
          python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              data = tomllib.load(f)
          deps = data['project']['dependencies']
          assert any('actenon-protocol' in d and '1.5.0' in d for d in deps), (
              f'actenon-protocol >= 1.5.0 not pinned in dependencies: {deps}'
          )
          print('OK: actenon-protocol >= 1.5.0 pinned')
          "
